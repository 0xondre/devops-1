server {
    listen 80 default_server;
    server_name _;

    root /var/www/notes;
    index index.html;

    # Angular SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy do backendu na osobnej VM (zmień IP)
    location /api/ {
        proxy_pass http://192.168.56.11:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
